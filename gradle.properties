# ===========================================================================
# Link Lyric — 分支共享的 Gradle 设置
#
# 本文件在两个分支（26.1.2 / 1.21.1）中内容一致，仅 MC_VERSION 段不同。
# 版本数据来源：FabricMC/fabric-example-mod 对应分支 + meta.fabricmc.net
# 修改 MC 版本时，请同步 fabric-loom 插件 id 与 Java toolchain（见各模块 build）。
# ===========================================================================

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Loom / NeoForge 对配置缓存支持不一致，先关闭以免误判构建失败
org.gradle.configuration-cache=false
org.gradle.caching=true

# Gradle 自身运行在 JDK 25（Loom 1.18+ 与 NeoForge ModDev 需要较新运行时）
org.gradle.java.home=C:/GRAALVM/graalvm-jdk-25.0.1+8.1

# 供 Java toolchain 解析的本地 JDK（21 用于 1.21.1 分支，25 用于 26.1.2 分支）
org.gradle.java.installations.paths=C:/GRAALVM/graalvm-jdk-25.0.1+8.1,C:/Program Files/Java/jdk-21,C:/GRAALVM/graalvm-jdk-21.0.6+8.1

# ---------------------------------------------------------------------------
# Minecraft 版本段 —— 每个分支独立修改
# ---------------------------------------------------------------------------
minecraft_version=1.21.1
loader_version=0.19.5
loom_version=1.18-SNAPSHOT
fabric_api_version=0.116.17+1.21.1
neoforge_version=21.1.264
moddev_version=2.0.148

# 本分支编译目标 Java 版本（26.1.2 -> 25，1.21.1 -> 21）
java_release=21

# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Mod 元信息
# ---------------------------------------------------------------------------
mod_version=0.1.0
maven_group=com.linklyric
archives_base_name=linklyric
mod_id=linklyric
mod_name=Link Lyric
mod_description=Show synced lyrics, playlist and playback state from any desktop player inside Minecraft.
mod_author=Link Lyric
