# ===========================================================================
# Link Lyric — 分支共享的 Gradle 设置
#
# 本文件在两个分支（26.1.2 / 1.21.1）中内容一致，仅 MC_VERSION 段不同。
# 版本数据来源：FabricMC/fabric-example-mod 对应分支 + meta.fabricmc.net
# 修改 MC 版本时，请同步 fabric-loom 插件 id 与 Java toolchain（见各模块 build）。
# ===========================================================================

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Loom / NeoForge 对配置缓存支持不一致，先关闭以免误判构建失败
org.gradle.configuration-cache=false
org.gradle.caching=true

# ---------------------------------------------------------------------------
# JDK 位置不写在这里。
#
# 这两个键此前是作者本机的绝对路径（C:/GRAALVM/...），提交后任何其它机器
# 上 clone 下来都会因为路径不存在而直接构建失败。它们属于「本机环境」而非
# 「工程约定」，正确位置是用户级配置：
#
#   ~/.gradle/gradle.properties
#   org.gradle.java.home=<本机 JDK 25 路径>
#   org.gradle.java.installations.paths=<本机 JDK 21 与 25 路径，逗号分隔>
#
# 各模块的 toolchain 只声明「需要哪个大版本」，由 Gradle 自行在已注册的
# 安装路径中挑选，因此仓库里不需要出现任何绝对路径。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Minecraft 版本段 —— 每个分支独立修改
# ---------------------------------------------------------------------------
minecraft_version=1.21.4
loader_version=0.20.1
loom_version=1.18-SNAPSHOT
fabric_api_version=0.119.4+1.21.4
neoforge_version=21.4.161
moddev_version=2.0.148

# 本分支编译目标 Java 版本（1.21.x -> 21，26.x -> 25）
java_release=21

# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Mod 元信息
# ---------------------------------------------------------------------------
mod_version=0.1.0
maven_group=com.linklyric
archives_base_name=linklyric
mod_id=linklyric
mod_name=Link Lyric
mod_description=Show synced lyrics, playlist and playback state from any desktop player inside Minecraft.
mod_author=Link Lyric
