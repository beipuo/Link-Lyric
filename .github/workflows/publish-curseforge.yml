# 发布到 CurseForge —— Link Lyric 专用
#
# 与 ExtendedAE_Plus 的单 jar 不同，本仓库一次构建产出两个平台 jar：
#   fabric/build/libs/<archives_base_name>-<mc>-fabric-<ver>.jar
#   neoforge/build/libs/<archives_base_name>-<mc>-neoforge-<ver>.jar
# 两者作为同一次 CurseForge 版本的两个文件上传（单项目形态）。
#
# 若你在 CurseForge 上是「Fabric 一个项目、NeoForge 另一个项目」，
# 请删掉 publish 步骤里的第二个文件与 project-id 覆盖写法，拆成两个 job。
# 详见文件末尾注释。

name: Publish to CurseForge

on:
  push:
  workflow_dispatch:
    inputs:
      version_type:
        description: CurseForge release type
        required: true
        type: choice
        default: release
        options:
          - release
          - beta
          - alpha

permissions:
  contents: read

# 同一 ref 串行，避免连推两次撞出重复版本号
concurrency:
  group: publish-curseforge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Publish
    # 手动触发无条件执行；push 要求是受保护分支（tag 不算）。
    # 未开启分支保护的话，可换成：github.ref == 'refs/heads/main'
    if: github.event_name == 'workflow_dispatch' || github.ref_protected == true
    runs-on: ubuntu-latest

    steps:
      - name: Check trigger
        id: check
        shell: bash
        env:
          # 用 env 中转，杜绝提交信息被插值进脚本造成命令注入
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_TYPE: ${{ inputs.version_type }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            should_publish="true"
            release_type="${INPUT_TYPE:-release}"
          else
            # 只看标题行：正文带 body 也不会漏发
            first_line="$(printf '%s\n' "${COMMIT_MSG}" | head -n1)"
            if [[ "${first_line}" =~ ^更新.+版本([;；]日志:[^[:space:];；]+)?$ ]]; then
              should_publish="true"
            else
              should_publish="false"
            fi
            release_type="release"
          fi

          {
            echo "should_publish=${should_publish}"
            echo "release_type=${release_type}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.check.outputs.should_publish == 'true'
        uses: actions/checkout@v4
        with:
          # 取 CHANGELOG 增量与「日志:<修订号>」需要完整历史
          fetch-depth: 0

      - name: Set up Java 21
        if: steps.check.outputs.should_publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        if: steps.check.outputs.should_publish == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Read release metadata
        id: metadata
        if: steps.check.outputs.should_publish == 'true'
        shell: bash
        run: |
          read_prop() {
            grep "^$1=" gradle.properties | head -n1 | cut -d'=' -f2- | tr -d '\r'
          }

          archives_base_name="$(read_prop archives_base_name)"
          mc_version="$(read_prop minecraft_version)"
          mod_version="$(read_prop mod_version)"
          mod_name="$(read_prop mod_name)"

          # 精确命中 build.gradle.kts 的 archivesName 规则：
          # base.archivesName = "<archives_base_name>-<mc>-<platform>"
          # 前缀同时避开 -sources.jar
          fabric_jar="fabric/build/libs/${archives_base_name}-${mc_version}-fabric-${mod_version}.jar"
          neoforge_jar="neoforge/build/libs/${archives_base_name}-${mc_version}-neoforge-${mod_version}.jar"

          release_name="${mod_name} ${mod_version} [Fabric + NeoForge ${mc_version}]"

          {
            echo "fabric_jar=${fabric_jar}"
            echo "neoforge_jar=${neoforge_jar}"
            echo "mc_version=${mc_version}"
            echo "mod_version=${mod_version}"
            echo "release_name=${release_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve changelog
        id: changelog
        if: steps.check.outputs.should_publish == 'true'
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          head_commit="${{ github.sha }}"
          base_commit="${{ github.event.before }}"

          # 提交信息含「日志:<修订号>」时取该修订的 CHANGELOG 变更
          changelog_revision=""
          if [[ "${COMMIT_MSG}" =~ 日志:([^[:space:]]+) ]]; then
            changelog_revision="${BASH_REMATCH[1]}"
          fi

          # 手动触发没有 event.before，退回父提交
          if [[ -z "${base_commit}" || "${base_commit}" =~ ^0+$ ]]; then
            base_commit="$(git rev-parse "${head_commit}^" 2>/dev/null || true)"
          fi

          changelog_content=""
          if [[ -f CHANGELOG.md ]]; then
            if [[ -n "${changelog_revision}" ]]; then
              target_commit="$(git rev-parse --verify "${changelog_revision}^{commit}" 2>/dev/null || true)"
              if [[ -z "${target_commit}" ]]; then
                echo "::error::无法解析日志修订号: ${changelog_revision}" >&2
                exit 1
              fi
              changelog_content="$(git show --format= --unified=0 --no-ext-diff "${target_commit}" -- CHANGELOG.md \
                | awk '/^\+\+\+ / { next } /^\+/ { sub(/^\+/, ""); print }')"
            elif [[ -n "${base_commit}" ]] && git cat-file -e "${base_commit}^{commit}" 2>/dev/null; then
              changelog_content="$(git diff --unified=0 "${base_commit}" "${head_commit}" -- CHANGELOG.md \
                | awk '/^\+\+\+ / { next } /^\+/ { sub(/^\+/, ""); print }')"
            fi
          fi

          # 没有 CHANGELOG.md 或本次未改动它：用提交信息正文兜底
          if [[ -z "${changelog_content}" ]]; then
            changelog_content="$(printf '%s\n' "${COMMIT_MSG}" | tail -n +2 | sed '/^[[:space:]]*$/d')"
          fi

          if [[ -z "${changelog_content}" ]]; then
            changelog_content="本次提交未提供变更说明。"
          fi

          {
            echo "content<<EOF"
            printf '%s\n' "${changelog_content}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        if: steps.check.outputs.should_publish == 'true'
        run: chmod +x ./gradlew

      - name: Build mod
        if: steps.check.outputs.should_publish == 'true'
        # build 会带上 :common:test 与 check 上挂的
        # verifyMirroredRender / verifyPainterParity 等双端漂移守卫
        run: ./gradlew build

      - name: Validate built artifacts
        if: steps.check.outputs.should_publish == 'true'
        shell: bash
        env:
          FABRIC_JAR: ${{ steps.metadata.outputs.fabric_jar }}
          NEOFORGE_NEOFORGE_JAR: ${{ steps.metadata.outputs.neoforge_jar }}
        run: |
          failed=0
          for f in "${FABRIC_JAR}" "${NEOFORGE_NEOFORGE_JAR}"; do
            if [[ ! -f "${f}" ]]; then
              echo "::error::未找到构建产物: ${f}" >&2
              failed=1
            fi
          done
          if [[ "${failed}" == "1" ]]; then
            ls -R fabric/build/libs neoforge/build/libs 2>/dev/null || true
            exit 1
          fi

      - name: Upload to CurseForge
        if: steps.check.outputs.should_publish == 'true'
        # environment 挂在 step 上而非 job 上：
        # 挂 job 级会导致每次 push（即便不发布）都弹一次审批。
        # 不用审批就整段删掉，并把 token 留在仓库级 Secrets。
        environment:
          name: publish
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          name: ${{ steps.metadata.outputs.release_name }}
          version: ${{ steps.metadata.outputs.mod_version }}
          version-type: ${{ steps.check.outputs.release_type }}
          changelog: ${{ steps.changelog.outputs.content }}
          files: |
            ${{ steps.metadata.outputs.fabric_jar }}
            ${{ steps.metadata.outputs.neoforge_jar }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          loaders: |
            fabric
            neoforge
          environment: client | server
          game-versions: |
            ${{ steps.metadata.outputs.mc_version }}

# ===========================================================================
# 若 Fabric 与 NeoForge 在 CurseForge 是两个独立项目
# ---------------------------------------------------------------------------
# 把上面的 Upload to CurseForge 单步拆成两步，各自带 files 与 project id：
#
#   - name: Upload Fabric to CurseForge
#     uses: Kira-NT/mc-publish@v3.3.1
#     with:
#       files: <fabric jar>
#       curseforge-id: <vars.CURSEFORGE_PROJECT_ID_FABRIC>
#       loaders: fabric
#       ...其余同上
#
#   - name: Upload NeoForge to CurseForge
#     uses: Kira-NT/mc-publish@v3.3.1
#     with:
#       files: <neoforge jar>
#       curseforge-id: <vars.CURSEFORGE_PROJECT_ID_NEOFORGE>
#       loaders: neoforge
#       ...其余同上
#
# 拆开时 version 名要区分，例如加 " [Fabric]" / " [NeoForge]" 后缀，
# 否则两个项目上的版本名完全相同，排查时难以分辨。
# ===========================================================================
