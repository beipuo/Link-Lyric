# 发布到 CurseForge —— Link Lyric 专用

name: Publish to CurseForge

on:
  push:
  workflow_dispatch:
    inputs:
      version_type:
        description: CurseForge release type
        required: true
        type: choice
        default: release
        options:
          - release
          - beta
          - alpha

permissions:
  contents: read

concurrency:
  group: publish-curseforge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # 手动触发无条件执行；push 要求是受保护分支（tag 不算）。
    # 未开启分支保护的话，可换成：github.ref == 'refs/heads/1.21.1'
    if: github.event_name == 'workflow_dispatch' || github.ref_protected == true
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      release_type: ${{ steps.check.outputs.release_type }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      mod_version: ${{ steps.metadata.outputs.mod_version }}
      mc_version: ${{ steps.metadata.outputs.mc_version }}
      fabric_jar: ${{ steps.metadata.outputs.fabric_jar }}
      neoforge_jar: ${{ steps.metadata.outputs.neoforge_jar }}
      changelog: ${{ steps.changelog.outputs.content }}

    steps:
      - name: Check trigger
        id: check
        shell: bash
        env:
          # 用 env 中转：提交信息直接插值进脚本会被展开执行
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_TYPE: ${{ inputs.version_type }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            should_publish="true"
            release_type="${INPUT_TYPE:-release}"
          else
            # 只看标题行：正文带 body 也不会漏发
            first_line="$(printf '%s\n' "${COMMIT_MSG}" | head -n1)"
            if [[ "${first_line}" =~ ^更新.+版本([;；]日志:[^[:space:];；]+)?$ ]]; then
              should_publish="true"
            else
              should_publish="false"
            fi
            release_type="release"
          fi

          {
            echo "should_publish=${should_publish}"
            echo "release_type=${release_type}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.check.outputs.should_publish == 'true'
        uses: actions/checkout@v4
        with:
          # 取 CHANGELOG 增量与「日志:<修订号>」需要完整历史
          fetch-depth: 0

      - name: Set up Java 21
        if: steps.check.outputs.should_publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        if: steps.check.outputs.should_publish == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Read release metadata
        id: metadata
        if: steps.check.outputs.should_publish == 'true'
        shell: bash
        run: |
          read_prop() {
            grep "^$1=" gradle.properties | head -n1 | cut -d'=' -f2- | tr -d '\r'
          }

          archives_base_name="$(read_prop archives_base_name)"
          mc_version="$(read_prop minecraft_version)"
          mod_version="$(read_prop mod_version)"
          mod_name="$(read_prop mod_name)"

          # 精确命中 build.gradle.kts 的 archivesName 规则，
          # 完整前缀同时避开 -sources.jar
          fabric_jar="fabric/build/libs/${archives_base_name}-${mc_version}-fabric-${mod_version}.jar"
          neoforge_jar="neoforge/build/libs/${archives_base_name}-${mc_version}-neoforge-${mod_version}.jar"
          release_name="${mod_name} ${mod_version} [Fabric + NeoForge ${mc_version}]"

          {
            echo "fabric_jar=${fabric_jar}"
            echo "neoforge_jar=${neoforge_jar}"
            echo "mc_version=${mc_version}"
            echo "mod_version=${mod_version}"
            echo "release_name=${release_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve changelog
        id: changelog
        if: steps.check.outputs.should_publish == 'true'
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          head_commit="${{ github.sha }}"
          base_commit="${{ github.event.before }}"

          changelog_revision=""
          if [[ "${COMMIT_MSG}" =~ 日志:([^[:space:]]+) ]]; then
            changelog_revision="${BASH_REMATCH[1]}"
          fi

          # 手动触发没有 event.before，退回父提交
          if [[ -z "${base_commit}" || "${base_commit}" =~ ^0+$ ]]; then
            base_commit="$(git rev-parse "${head_commit}^" 2>/dev/null || true)"
          fi

          changelog_content=""
          if [[ -f CHANGELOG.md ]]; then
            if [[ -n "${changelog_revision}" ]]; then
              target_commit="$(git rev-parse --verify "${changelog_revision}^{commit}" 2>/dev/null || true)"
              if [[ -z "${target_commit}" ]]; then
                echo "::error::无法解析日志修订号: ${changelog_revision}" >&2
                exit 1
              fi
              changelog_content="$(git show --format= --unified=0 --no-ext-diff "${target_commit}" -- CHANGELOG.md \
                | awk '/^\+\+\+ / { next } /^\+/ { sub(/^\+/, ""); print }')"
            elif [[ -n "${base_commit}" ]] && git cat-file -e "${base_commit}^{commit}" 2>/dev/null; then
              changelog_content="$(git diff --unified=0 "${base_commit}" "${head_commit}" -- CHANGELOG.md \
                | awk '/^\+\+\+ / { next } /^\+/ { sub(/^\+/, ""); print }')"
            fi
          fi

          # 没有 CHANGELOG.md 或本次未改动它：用提交信息正文兜底
          if [[ -z "${changelog_content}" ]]; then
            changelog_content="$(printf '%s\n' "${COMMIT_MSG}" | tail -n +2 | sed '/^[[:space:]]*$/d')"
          fi

          if [[ -z "${changelog_content}" ]]; then
            changelog_content="本次提交未提供变更说明。"
          fi

          {
            echo "content<<EOF"
            printf '%s\n' "${changelog_content}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        if: steps.check.outputs.should_publish == 'true'
        run: chmod +x ./gradlew

      - name: Build mod
        if: steps.check.outputs.should_publish == 'true'
        # build 会带上 :common:test 与 check 上挂的
        # verifyMirroredRender / verifyPainterParity 等双端漂移守卫
        run: ./gradlew build

      - name: Validate built artifacts
        if: steps.check.outputs.should_publish == 'true'
        shell: bash
        env:
          FABRIC_JAR: ${{ steps.metadata.outputs.fabric_jar }}
          NEOFORGE_JAR: ${{ steps.metadata.outputs.neoforge_jar }}
        run: |
          failed=0
          for f in "${FABRIC_JAR}" "${NEOFORGE_JAR}"; do
            if [[ ! -f "${f}" ]]; then
              echo "::error::未找到构建产物: ${f}" >&2
              failed=1
            fi
          done
          if [[ "${failed}" == "1" ]]; then
            ls -R fabric/build/libs neoforge/build/libs 2>/dev/null || true
            exit 1
          fi

      - name: Package artifacts
        if: steps.check.outputs.should_publish == 'true'
        shell: bash
        env:
          FABRIC_JAR: ${{ steps.metadata.outputs.fabric_jar }}
          NEOFORGE_JAR: ${{ steps.metadata.outputs.neoforge_jar }}
        # 打包保留相对路径，便于发布 job 还原到同一位置
        run: tar -czf release-artifact.tar.gz "${FABRIC_JAR}" "${NEOFORGE_JAR}"

      - name: Upload build artifact
        if: steps.check.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: release-artifact.tar.gz
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish to CurseForge
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    # environment 只能写在 job 级。构建阶段不触发审批，
    # 只有走到这里才需要人工确认。
    environment:
      name: publish

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-build

      - name: Unpack build artifact
        run: tar -xzf release-artifact.tar.gz

      - name: Validate artifact exists
        shell: bash
        env:
          FABRIC_JAR: ${{ needs.build.outputs.fabric_jar }}
          NEOFORGE_JAR: ${{ needs.build.outputs.neoforge_jar }}
        run: |
          failed=0
          for f in "${FABRIC_JAR}" "${NEOFORGE_JAR}"; do
            if [[ ! -f "${f}" ]]; then
              echo "::error::解包后未找到产物: ${f}" >&2
              failed=1
            fi
          done
          [[ "${failed}" == "1" ]] && exit 1 || true

      - name: Upload to CurseForge
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          name: ${{ needs.build.outputs.release_name }}
          version: ${{ needs.build.outputs.mod_version }}
          version-type: ${{ needs.build.outputs.release_type }}
          changelog: ${{ needs.build.outputs.changelog }}
          files: |
            ${{ needs.build.outputs.fabric_jar }}
            ${{ needs.build.outputs.neoforge_jar }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          loaders: |
            fabric
            neoforge
          environment: client | server
          game-versions: |
            ${{ needs.build.outputs.mc_version }}
